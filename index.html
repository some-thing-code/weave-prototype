<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weave — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#F5F6F3;color:#1A1A18;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.logo{font-size:20px;font-weight:600;color:#2D6A4F;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dot{width:12px;height:12px;border-radius:50%;background:#40916C}
.tagline{font-size:15px;color:#6B7166;margin-bottom:52px;text-align:center}
.cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{background:#fff;border:1px solid #E6E8E3;border-radius:16px;padding:32px 36px;width:240px;text-decoration:none;color:#1A1A18;display:flex;flex-direction:column;align-items:flex-start;gap:14px;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-2px)}
.card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.card-title{font-size:16px;font-weight:500}
.card-sub{font-size:13px;color:#6B7166;line-height:1.5}
.card-arrow{font-size:18px;color:#40916C;margin-top:4px}
.note{margin-top:40px;font-size:12px;color:#8A8A84}
</style>
</head>
<body>
  <div class="logo"><span class="dot"></span>weave</div>
  <p class="tagline">Prototype — pick a view to explore</p>
  <div class="cards">
    <a href="/volunteer-dashboard" class="card">
      <div class="card-icon" style="background:#D8F3DC">🙋</div>
      <div>
        <div class="card-title">Volunteer view</div>
        <p class="card-sub">Hours ring, badges, upcoming events, activity feed</p>
      </div>
      <div class="card-arrow">→</div>
    </a>
    <a href="/org-dashboard" class="card">
      <div class="card-icon" style="background:#E1F5EE">🏢</div>
      <div>
        <div class="card-title">Org admin view</div>
        <p class="card-sub">Events, volunteer roster, org network, insights</p>
      </div>
      <div class="card-arrow">→</div>
    </a>
  </div>
  <p class="note">weavecommunity.io · prototype only</p>
</body>
</html>
